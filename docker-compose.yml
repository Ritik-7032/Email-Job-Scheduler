version: '3.8'

name: email-job-scheduler

services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-postgres
    restart: unless-stopped
    networks:
      - scheduler-network
    environment:
      POSTGRES_USER: scheduler_admin
      POSTGRES_PASSWORD: scheduler_password
      POSTGRES_DB: scheduler_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_admin -d scheduler_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scheduler-redis
    restart: unless-stopped
    networks:
      - scheduler-network
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scheduler-api
    restart: unless-stopped
    networks:
      - scheduler-network
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=postgresql://scheduler_admin:scheduler_password@postgres:5432/scheduler_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-email-job-scheduler-jwt-secret-key-32-chars
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      - GOOGLE_CALLBACK_URL=http://localhost:5000/api/auth/callback
      - SMTP_HOST=smtp.ethereal.email
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SENDER_COUNT=5
      - WORKER_CONCURRENCY=5
      - MIN_DELAY_BETWEEN_EMAILS_MS=2000
      - MAX_EMAILS_PER_HOUR=200
      - SEPARATE_WORKER=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scheduler-worker
    restart: unless-stopped
    networks:
      - scheduler-network
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://scheduler_admin:scheduler_password@postgres:5432/scheduler_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-email-job-scheduler-jwt-secret-key-32-chars
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      - SMTP_HOST=smtp.ethereal.email
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SENDER_COUNT=5
      - WORKER_CONCURRENCY=5
      - MIN_DELAY_BETWEEN_EMAILS_MS=2000
      - MAX_EMAILS_PER_HOUR=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scheduler-frontend
    restart: unless-stopped
    networks:
      - scheduler-network
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
    name: scheduler_postgres_data
  redis_data:
    name: scheduler_redis_data

networks:
  scheduler-network:
    name: scheduler-net
